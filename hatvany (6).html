<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hatványkifejezés-generátor</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent-bg: #eff6ff;
      --ok: #16a34a;
      --ok-bg: #f0fdf4;
      --bad: #dc2626;
      --bad-bg: #fef2f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      margin-bottom: 1.25rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.75rem 1.25rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    button {
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      padding: 0.65rem 1.3rem;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      transition: all 0.15s ease;
    }

    button:hover {
      background: #f1f5f9;
    }

    button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    button.primary:hover {
      background: var(--primary-hover);
    }

    .actions {
      display: flex;
      gap: 0.6rem;
    }

    /* Szintválasztó: a „Negatív alap" fejléc alatt a 6 alszint-gomb */
    .levels {
      display: grid;
      grid-template-columns: repeat(4, auto) repeat(6, minmax(2rem, 2.6rem));
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .levels button {
      border: none;
      border-radius: 0;
      padding: 0.5rem 0.9rem;
    }

    .levels > button + button,
    .levels button[data-sub="1"] {
      border-left: 1px solid var(--border);
    }

    .levels button[data-level]:not([data-sub]) {
      grid-row: 1 / span 2;
    }

    .levels button[data-sub] {
      grid-row: 2;
      padding: 0.4rem 0;
      font-size: 0.9rem;
    }

    .levels button[aria-checked="true"] {
      background: var(--primary);
      color: #fff;
    }

    .neg-head {
      grid-column: 5 / span 6;
      grid-row: 1;
      padding: 0.45rem 0.8rem;
      border-left: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      user-select: none;
    }

    .neg-head.active {
      background: var(--accent-bg);
      color: var(--primary);
    }

    /* Keskeny képernyő: a szintgombok három sorban, a kártya teljes szélességében */
    @media (max-width: 560px) {
      .levels {
        grid-template-columns: repeat(60, minmax(0, 1fr));
        width: 100%;
      }

      .levels button[data-level]:not([data-sub]) {
        grid-row: 1;
        grid-column: span 15;
        padding: 0.55rem 0.1rem;
      }

      .neg-head {
        grid-column: 1 / -1;
        grid-row: 2;
        border-left: none;
        border-top: 1px solid var(--border);
      }

      .levels button[data-sub] {
        grid-row: 3;
        grid-column: span 10;
        padding: 0.5rem 0;
      }

      .levels button[data-sub="1"] {
        border-left: none;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }
    }

    /* Matematikai megjelenítés */
    .formula-box {
      background: var(--accent-bg);
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 1.75rem 1rem;
      text-align: center;
      font-size: 1.55rem;
      font-family: "Cambria Math", "Times New Roman", serif;
      overflow-x: auto;
    }

    .fraction {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
    }

    .numerator {
      display: block;
      border-bottom: 2px solid var(--text);
      padding: 0 0.6rem 0.25rem;
    }

    .denominator {
      display: block;
      padding: 0.25rem 0.6rem 0;
    }

    sup {
      font-size: 0.68em;
      line-height: 0;
    }

    /* Saját válasz */
    .answer-title {
      font-size: 1.1rem;
      margin-bottom: 0.2rem;
    }

    .answer-hint {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .answer-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.5rem 0.4rem;
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .ans-field {
      display: inline-flex;
      align-items: flex-start;
    }

    .ans-input {
      width: 3.4rem;
      margin: -0.35rem 0 0 0.1rem;
      padding: 0.25rem 0.3rem;
      font-family: inherit;
      font-size: 1rem;
      text-align: center;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }

    .ans-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .ans-input.ok {
      border-color: var(--ok);
      background: var(--ok-bg);
    }

    .ans-input.bad {
      border-color: var(--bad);
      background: var(--bad-bg);
    }

    .answer-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .ans-sign {
      width: 2.6rem;
      margin: 0 0.2rem 0 0;
      font-size: 1.2rem;
    }

    .ans-text {
      width: 15rem;
      max-width: 100%;
      margin: 0;
      padding: 0.45rem 0.6rem;
      font-size: 1.2rem;
      text-align: left;
    }

    /* A begépelt válasz szerkesztője: valódi felső index, üres kitevő-doboz */
    .ans-editor {
      display: inline-block;
      min-height: 2.7rem;
      overflow-x: auto;
      white-space: nowrap;
      font-family: "Cambria Math", "Times New Roman", serif;
      line-height: 1.5;
      vertical-align: middle;
      cursor: text;
    }

    .ans-editor:empty::before {
      content: attr(data-placeholder);
      color: #94a3b8;
    }

    .ans-editor sup {
      font-size: 0.7em;
      line-height: 1;
    }

    .ans-editor sup.exp-empty {
      display: inline-block;
      min-width: 0.8em;
      height: 0.9em;
      margin: 0 0.1em;
      border: 1.5px dashed var(--primary);
      border-radius: 3px;
      vertical-align: 0.5em;
    }

    .pow-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .pow-btn,
    .mul-btn {
      padding: 0.4rem 0.8rem;
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 1.1rem;
      line-height: 1.2;
    }

    /* Alulról kapcsos zárójellel összefogott kifejezés (előjel-leválasztás) */
    .ub {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: baseline;
    }

    .ub-brace {
      position: relative;
      align-self: stretch;
      height: 0.4em;
      margin-top: 0.1em;
      border: 1.5px solid currentColor;
      border-top: none;
      border-radius: 0 0 0.6em 0.6em;
    }

    .ub-brace::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      height: 0.25em;
      border-left: 1.5px solid currentColor;
    }

    .ub.ghost .ub-brace,
    .ub.ghost .ub-label {
      visibility: hidden;
    }

    .ub-label {
      margin-top: 0.3em;
      font-size: 0.85em;
      color: var(--primary);
      font-weight: 600;
      white-space: nowrap;
    }

    /* Zárójelpár, ami a teljes tört magasságát befogja */
    .big-paren {
      display: inline-flex;
      align-items: stretch;
      vertical-align: middle;
    }

    .paren {
      flex: none;
      width: 0.45em;
    }

    .paren-l {
      border-left: 2px solid currentColor;
      border-radius: 100% 0 0 100% / 50% 0 0 50%;
    }

    .paren-r {
      border-right: 2px solid currentColor;
      border-radius: 0 100% 100% 0 / 0 50% 50% 0;
    }

    .paren-body {
      display: inline-flex;
      align-items: center;
      padding: 0.1em 0.2em;
    }

    .paren-exp {
      align-self: flex-start;
      margin-left: 0.1em;
      font-size: 0.68em;
      line-height: 1;
    }

    .signed-fraction {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .answer-preview {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.3rem 0.8rem;
      min-height: 3rem;
      margin-bottom: 1rem;
      padding: 0.5rem 0.9rem;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    .preview-label {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .preview-math {
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 1.3rem;
    }

    .preview-empty {
      color: var(--muted);
      font-family: inherit;
      font-size: 0.9rem;
    }

    .answer-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
    }

    .feedback {
      min-height: 1.5rem;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .feedback.ok {
      color: var(--ok);
    }

    .feedback.bad {
      color: var(--bad);
    }

    /* Megoldás lépései */
    .solution-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .solution-header h2 {
      font-size: 1.1rem;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .step {
      padding: 0.85rem 1rem;
      border-left: 3px solid var(--primary);
      background: var(--bg);
      border-radius: 0 8px 8px 0;
    }

    .step-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.4rem;
    }

    .step-math {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem 0.6rem;
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 1.2rem;
      overflow-x: auto;
    }

    .step-math + .step-math {
      margin-top: 0.5rem;
    }

    .eq-sign {
      color: var(--muted);
    }

    .zero {
      opacity: 0.45;
    }

    .final {
      background: var(--accent-bg);
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 0.2rem 0.7rem;
      font-size: 1.3rem;
    }

    .step-note {
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Hatványkifejezés-generátor</h1>
    </header>

    <div class="card">
      <div class="controls">
        <div id="levels" class="levels" role="radiogroup" aria-label="Szint"></div>
        <div class="actions">
          <button id="generateBtn" class="primary">Új szám generálása</button>
          <button id="fillBtn">Megoldás</button>
        </div>
      </div>
      <div id="formulaDisplay" class="formula-box" aria-live="polite"></div>
    </div>

    <div class="card">
      <h2 class="answer-title">Saját válasz</h2>
      <p id="answerHint" class="answer-hint">Írd fel az eredményt kanonikus alakban: a prímek növekvő sorrendben, utána a betűk. Ha egy alap nem szerepel, hagyd üresen (vagy írj 0-t).</p>
      <div id="answerRow" class="answer-row"></div>
      <div class="answer-preview">
        <span class="preview-label">Válasz:</span>
        <span id="previewMath" class="preview-math"></span>
      </div>
      <div class="answer-actions">
        <div class="answer-buttons">
          <button id="checkBtn" class="primary">Ellenőrzés</button>
        </div>
        <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
      </div>
    </div>

    <div class="card">
      <div class="solution-header">
        <h2>Lépésről lépésre megoldás</h2>
        <button id="toggleSolutionBtn" aria-controls="solutionContent" aria-expanded="false">Megoldás mutatása</button>
      </div>
      <div id="solutionContent" class="steps hidden"></div>
    </div>
  </div>

  <script>
    // ---------- Beállítások ----------
    const EXP_MIN = -5;
    const EXP_MAX = 5;
    const MINUS = "\u2212";
    const NBSP = "\u00A0";

    const LEVELS = {
      1: {
        numberBases: [2, 3, 5, 7],
        factorsPerGroup: 1,
        answerBases: [2, 3, 5, 7],
      },
      // (a · b^n1)^n2 – egyetlen zárójel, nincs nevező; a = prímszám, b = betű
      2: {
        single: true,
        numberBases: [2, 3, 5, 7],
        answerBases: [2, 3, 5, 7, "b"],
      },
      3: {
        factorsPerGroup: 2,
        numberBases: [2, 3, 5, 7],
        answerBases: [2, 3, 5, 7],
      },
      // (a · b^n1)^n2 – egyetlen zárójel, nincs nevező; a = összetett szám, b = betű
      4: {
        single: true,
        numberBases: [4, 6, 8, 10, 12, 14, 16],
        answerBases: [2, 3, 5, 7, "b"],
      },
      // „Negatív alap": külön üzemmód 1–5. alszinttel (lásd NEG_SUBLEVELS)
      neg: { neg: true },
    };

    const NEG_PRIMES = [2, 3, 5, 7];
    const NEG_SUBLEVELS = {
      1: { answerBases: [2, 3, 5, 7] },
      2: { answerBases: [2, 3, 5, 7, "b"] },
      3: { answerBases: [2, 3, 5, 7] },
      4: { answerBases: [2, 3, 5, 7, "b", "d"] },
      5: { answerBases: [2, 3, 5, 7, "b"] },
      6: { answerBases: [2, 3, 5, 7, "b"] },
    };

    let state = { level: 1, sub: 1, problem: null, solution: null };

    // ---------- Segédfüggvények ----------
    const $ = (id) => document.getElementById(id);

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pick(list) {
      return list[randInt(0, list.length - 1)];
    }

    const isLetter = (base) => typeof base === "string";

    // Kanonikus sorrend: előbb a számok növekvően, utána a betűk betűrendben
    function compareBases(x, y) {
      if (isLetter(x) !== isLetter(y)) return isLetter(x) ? 1 : -1;
      return isLetter(x) ? x.localeCompare(y) : x - y;
    }

    // Prímtényezős felbontás: 12 -> [[2, 2], [3, 1]]
    function factorize(n) {
      const result = [];
      for (let p = 2; n > 1; p++) {
        let k = 0;
        while (n % p === 0) {
          n /= p;
          k++;
        }
        if (k > 0) result.push([p, k]);
      }
      return result;
    }

    function isComposite(n) {
      const f = factorize(n);
      return f.length > 1 || (f.length === 1 && f[0][1] > 1);
    }

    // ---------- Formázás (magyar konvenciók, valódi mínusz) ----------
    function fmtInt(n) {
      return n < 0 ? MINUS + Math.abs(n) : String(n);
    }

    // Negatív kitevő zárójelben: pl. (−2)
    function wrapNeg(n) {
      return n < 0 ? `(${fmtInt(n)})` : String(n);
    }

    // ---------- HTML-építők ----------
    const DOT = " &middot; ";

    function baseHTML(base) {
      return isLetter(base) ? `<i>${base}</i>` : String(base);
    }

    function power(base, exp) {
      return `${baseHTML(base)}<sup>${fmtInt(exp)}</sup>`;
    }

    function fraction(top, bottom) {
      return `<span class="fraction"><span class="numerator">${top}</span><span class="denominator">${bottom}</span></span>`;
    }

    function expr(html) {
      return `<span class="expr">${html}</span>`;
    }

    function eqSign(sign = "=") {
      return `<span class="eq-sign">${sign}</span>`;
    }

    function equation(parts) {
      return parts.map(expr).join(eqSign());
    }


    // ---------- Feladat és megoldás ----------
    // Egy feladat egy vagy két csoportból áll (számláló, nevező): { factors: [{ base, exp }], outer }
    // 1–2. szint: (x1^e1 [· x2^e2])^outer / (…)^outer
    // 3. szint:   (a · b^e)^outer, ahol a = összetett szám (kitevő nélkül), b = betű
    function createGroup(cfg) {
      if (cfg.single) {
        return {
          factors: [
            { base: pick(cfg.numberBases), exp: 1, plain: true },
            { base: "b", exp: randInt(EXP_MIN, EXP_MAX) },
          ],
          outer: randInt(EXP_MIN, EXP_MAX),
        };
      }
      const factors = Array.from({ length: cfg.factorsPerGroup }, () => ({
        base: pick(cfg.numberBases),
        exp: randInt(EXP_MIN, EXP_MAX),
      }));
      return { factors, outer: randInt(EXP_MIN, EXP_MAX) };
    }

    function solve(problem) {
      const mapped = problem.groups.map((g) => ({
        outer: g.outer,
        factors: g.factors.map((f) => ({ base: f.base, inner: f.exp, plain: f.plain, exp: f.exp * g.outer })),
      }));
      const [num, den] = mapped;

      // A nevező tagjai a szorzatba kerülnek, ellentett kitevővel
      const flipped = [
        ...num.factors.map((t) => ({ base: t.base, exp: t.exp })),
        ...(den ? den.factors : []).map((t) => ({ base: t.base, exp: -t.exp })),
      ];

      // Összetett számalapok felbontása prímekre
      const primeTerms = flipped.flatMap((t) =>
        isLetter(t.base)
          ? [t]
          : factorize(t.base).map(([p, k]) => ({ base: p, exp: k * t.exp }))
      );

      const totals = new Map();
      for (const { base, exp } of primeTerms) {
        totals.set(base, (totals.get(base) ?? 0) + exp);
      }

      return { groups: mapped, flipped, primeTerms, totals };
    }

    // Új feladat; az 1-et eredményező (triviális) feladatokat eldobja
    function createProblem(level, sub) {
      if (level === "neg") {
        const problem = createNegProblem(sub);
        return { problem, solution: solveNeg(problem) };
      }
      const cfg = LEVELS[level];
      for (;;) {
        const groups = cfg.single ? [createGroup(cfg)] : [createGroup(cfg), createGroup(cfg)];

        const problem = { level, groups };
        const solution = solve(problem);
        if ([...solution.totals.values()].some((e) => e !== 0)) {
          return { problem, solution };
        }
      }
    }

    // ---------- Negatív alap (külön üzemmód, 1–6. alszint) ----------
    const isOdd = (n) => Math.abs(n) % 2 === 1;
    const expRand = () => randInt(EXP_MIN, EXP_MAX);

    // 1: (−a)^n1                      2: (−a · b^n2)^n1
    // 3: (−a^n1 / c^n2)^n3            4: (−a · b)^n1 / (−c · d)^n2
    // 5: (−(±a^n1) / c^n2)^n3, az „a" előtti mínusz sorsolt
    function createNegProblem(sub) {
      if (sub === 5 || sub === 6) {
        // (−((a · b^n3)^n1) / c^n2)^n4, a ∈ {−7, −5, −3, −2, 2, 3, 5, 7}
        // 5. alszint: n1 páros (−4 … 4), így a két mínusz összevonása nem fordul elő
        return {
          kind: "neg", sub, a: pick([-7, -5, -3, -2, 2, 3, 5, 7]), c: pick(NEG_PRIMES),
          n1: sub === 5 ? pick([-4, -2, 0, 2, 4]) : expRand(), n2: expRand(), n3: expRand(), n4: expRand(),
        };
      }
      const p = { kind: "neg", sub, a: pick(NEG_PRIMES), n1: expRand() };
      if (sub === 2) p.n2 = expRand();
      if (sub >= 3) {
        p.c = pick(NEG_PRIMES);
        p.n2 = expRand();
      }
      if (sub === 3) p.n3 = expRand();
      return p;
    }

    function solveNeg(p) {
      const totals = new Map();
      const add = (base, e) => totals.set(base, (totals.get(base) ?? 0) + e);
      let negative = false;

      if (p.sub === 1) {
        add(p.a, p.n1);
        negative = isOdd(p.n1);
      } else if (p.sub === 2) {
        add(p.a, p.n1);
        add("b", p.n1 * p.n2);
        negative = isOdd(p.n1);
      } else if (p.sub === 3) {
        add(p.a, p.n1 * p.n3);
        add(p.c, -(p.n2 * p.n3));
        negative = isOdd(p.n3);
      } else if (p.sub >= 5) {
        // az alap előjele: a tört előtti mínusz × (a negatív, páratlan kitevőn → −1)
        const baseNegative = !(p.a < 0 && isOdd(p.n1));
        add(Math.abs(p.a), p.n1 * p.n4);
        add("b", p.n3 * p.n1 * p.n4);
        add(p.c, -(p.n2 * p.n4));
        negative = baseNegative && isOdd(p.n4);
      } else {
        add(p.a, p.n1);
        add("b", p.n1);
        add(p.c, -p.n2);
        add("d", -p.n2);
        negative = isOdd(p.n1 + p.n2);
      }
      return { totals, negative };
    }

    // A tört magasságához igazodó zárójelpár, jobb felső sarkában a kitevővel
    function bigParen(inner, exp) {
      return `<span class="big-paren"><span class="paren paren-l"></span><span class="paren-body">${inner}</span><span class="paren paren-r"></span><span class="paren-exp">${fmtInt(exp)}</span></span>`;
    }

    function signedFraction(minus, top, bottom) {
      return `<span class="signed-fraction"><span>${minus}</span>${fraction(top, bottom)}</span>`;
    }

    // A tört előtti mínusz (3. alszint)
    function negFraction(p) {
      return signedFraction(MINUS, power(p.a, p.n1), power(p.c, p.n2));
    }

    // A feladat leírása: a hatványozott alap felépítése (1., 2., 3. és 5. alszint)
    //   top: a számláló/szorzat tényezői ({base, exp} vagy {base, plain: true}), den: nevező, ni: belső kitevő, k: külső kitevő
    function specOf(p) {
      const { a, c, n1, n2, n3 } = p;
      if (p.sub === 1) return { frac: false, top: [{ base: a, plain: true }], ni: null, den: null, k: n1 };
      if (p.sub === 2) {
        return { frac: false, top: [{ base: a, plain: true }, { base: "b", exp: n2 }], ni: null, den: null, k: n1 };
      }
      if (p.sub === 3) {
        return { frac: true, top: [{ base: a, exp: n1 }], ni: null, den: { base: c, exp: n2 }, k: n3 };
      }
      return {
        frac: true,
        top: [{ base: Math.abs(a), plain: true, neg: a < 0 }, { base: "b", exp: n3 }],
        ni: n1,
        den: { base: c, exp: n2 },
        k: p.n4,
      };
    }

    // reduced: a 0 kitevőjű hatványok helyén 1 áll; hl: a 0 kitevőjű hatványok kiemelve
    function renderBase(spec, { hl = false, reduced = false } = {}) {
      let top = spec.top;
      let den = spec.den;
      const ni = spec.ni;
      const isZeroPiece = (pc) => !pc.plain && pc.exp === 0;
      if (reduced) {
        top = top.filter((pc) => !isZeroPiece(pc));
        if (den && den.exp === 0) den = null;
      }
      const z = (html, isZero) => (hl && isZero ? `<span class="zero">${html}</span>` : html);
      const pieceStr = (pc) =>
        pc.plain ? `${pc.neg ? MINUS : ""}${pc.base}` : z(power(pc.base, pc.exp), isZeroPiece(pc));
      let topStr = top.map(pieceStr).join(DOT);
      if (ni !== null) {
        topStr = reduced && (ni === 0 || top.length === 0) ? "1" : z(`(${topStr})<sup>${fmtInt(ni)}</sup>`, ni === 0);
      } else if (top.length === 0) {
        topStr = "1";
      }
      const k = spec.k;
      const denStr = den ? z(power(den.base, den.exp), den.exp === 0) : null;
      const html =
        spec.frac && denStr
          ? bigParen(signedFraction(MINUS, topStr, denStr), k)
          : `(${MINUS}${topStr})<sup>${fmtInt(k)}</sup>`;
      return z(html, k === 0);
    }

    function negFormulaHTML(p) {
      const { a, c, n1, n2 } = p;
      if (p.sub === 4) {
        return fraction(
          `(${MINUS}${a}${DOT}${baseHTML("b")})<sup>${fmtInt(n1)}</sup>`,
          `(${MINUS}${c}${DOT}${baseHTML("d")})<sup>${fmtInt(n2)}</sup>`
        );
      }
      return renderBase(specOf(p));
    }

    // A hivatkozott azonosságok (egységes jelöléssel)
    const ID_PROD = "(a &middot; b)<sup>n</sup> = a<sup>n</sup> &middot; b<sup>n</sup>";
    const ID_FRAC = "(a / b)<sup>n</sup> = a<sup>n</sup> / b<sup>n</sup>";
    const ID_POW = "(a<sup>n</sup>)<sup>m</sup> = a<sup>n&middot;m</sup>";
    const ID_MUL = "a<sup>n</sup> &middot; a<sup>m</sup> = a<sup>n+m</sup>";
    const ID_DIV = "a<sup>n</sup> / a<sup>m</sup> = a<sup>n&minus;m</sup>";
    const ID_ZERO = "a<sup>0</sup> = 1";
    const ID_NEGEXP = "a<sup>&minus;n</sup> = 1 / a<sup>n</sup>";
    const SIGN_RULE = "Előjelszabály: páratlan kitevőnél a mínusz megmarad, páros kitevőnél eltűnik";

    // Ha valamelyik alap kitevője 0, külön lépés: a<sup>0</sup> = 1
    function zeroStep(steps, totals, sp = "") {
      const all = [...totals.keys()].sort(compareBases);
      if (!all.some((b) => totals.get(b) === 0)) return;
      const withPowers = all.map((b) => `<span${totals.get(b) === 0 ? ' class="zero"' : ""}>${power(b, totals.get(b))}</span>`).join(DOT);
      const withOnes = all.map((b) => (totals.get(b) === 0 ? "1" : power(b, totals.get(b)))).join(DOT);
      const rest = all.filter((b) => totals.get(b) !== 0).map((b) => power(b, totals.get(b))).join(DOT) || "1";
      const rows = (withOnes === rest ? [withPowers, withOnes] : [withPowers, withOnes, rest]).map((r) => sp + r);
      steps.push({
        title: `Nulladik hatvány: ${ID_ZERO}`,
        rows: [equation(rows)],
        note: "Az 1-gyel való szorzás nem változtat az értéken, ezért a 0 kitevőjű tényezőt elhagyhatjuk.",
      });
    }

    // Alulról kapcsos zárójellel összefogott kifejezés, alatta az értéke (pl. −1 vagy +1)
    const ub = (expr, label) =>
      `<span class="ub"><span class="ub-top">${expr}</span><span class="ub-brace"></span><span class="ub-label">${label}</span></span>`;
    const signLabel = (n) => (isOdd(n) ? `${MINUS}1` : "+1");
    const signNote = (n) =>
      n === 0
        ? `A 0 kitevő miatt (${MINUS}1)<sup>0</sup> = 1 (${ID_ZERO}), tehát +1.`
        : `${fmtInt(n)} ${isOdd(n) ? "páratlan" : "páros"} kitevő, ezért (${MINUS}1)<sup>${fmtInt(n)}</sup> = ${signLabel(n)}. ${SIGN_RULE}.`;

    // Azonos alapú tényezők összevonása egy lépésben (ha van ilyen)
    function mergeStep(steps, items, sp, title) {
      const groups = [];
      for (const it of items) {
        const g = groups.find((x) => x.base === it.base);
        if (g) g.exps.push(it.exp);
        else groups.push({ base: it.base, exps: [it.exp] });
      }
      if (groups.every((g) => g.exps.length === 1)) return;
      const sumOf = (exps) => exps.map(wrapNeg).join(" + ");
      steps.push({
        title,
        rows: [equation([
          sp + items.map((it) => power(it.base, it.exp)).join(DOT),
          sp + groups.map((g) => (g.exps.length === 1 ? power(g.base, g.exps[0]) : `${baseHTML(g.base)}<sup>${sumOf(g.exps)}</sup>`)).join(DOT),
          sp + groups.map((g) => power(g.base, g.exps.reduce((x, y) => x + y, 0))).join(DOT),
        ])],
      });
    }

    function buildNegSteps(p, solution) {
      const { a, c, n1, n2 } = p;
      const { totals, negative } = solution;
      const steps = [];
      const m1 = (n) => `(${MINUS}1)<sup>${fmtInt(n)}</sup>`;
      const sp = negative ? MINUS : ""; // az eredő előjel a továbbvitt egyenlőségekben
      const sf = (top, bottom) => (negative ? signedFraction(MINUS, top, bottom) : fraction(top, bottom));
      const odd = (n) => isOdd(n);
      const bases = new Set(); // a nulladik hatvány után még szereplő alapok

      const splitTitle = `Az előjel leválasztása: (${MINUS}1 &middot; a)<sup>n</sup> = (${MINUS}1)<sup>n</sup> &middot; a<sup>n</sup>`;
      const flipTitle = `A nevező kitevőinek átfordítása: ${ID_NEGEXP}`;
      const mergeTitle = `Közös alapok összevonása: ${ID_MUL}`;
      const zeroTitle = `Nulladik hatvány: ${ID_ZERO}`;
      const zeroNote = "A 0 kitevőjű hatvány helyére 1 kerül; az 1-gyel való szorzás és osztás nem változtat az értéken.";

      if (p.sub === 4) {
        // (−a·b)^n1 / (−c·d)^n2
        const hasTop = n1 !== 0;
        const hasBot = n2 !== 0;
        const topFactors = [power(a, n1), power("b", n1)];
        const botFactors = [power(c, n2), power("d", n2)];
        if (!hasTop || !hasBot) {
          const z = (html, isZero) => (isZero ? `<span class="zero">${html}</span>` : html);
          const topF = `(${MINUS}${a}${DOT}${baseHTML("b")})<sup>${fmtInt(n1)}</sup>`;
          const botF = `(${MINUS}${c}${DOT}${baseHTML("d")})<sup>${fmtInt(n2)}</sup>`;
          const reduced = hasTop || hasBot ? fraction(hasTop ? topF : "1", hasBot ? botF : "1") : "1";
          steps.push({
            title: zeroTitle,
            rows: [equation([fraction(z(topF, !hasTop), z(botF, !hasBot)), reduced].concat(hasTop || hasBot ? [] : []))],
            note: zeroNote,
          });
        }
        if (hasTop || hasBot) {
          const topPow = hasTop ? `${ub(m1(n1), signLabel(n1))}${DOT}${topFactors.join(DOT)}` : "1";
          const botPow = hasBot ? `${ub(m1(n2), signLabel(n2))}${DOT}${botFactors.join(DOT)}` : "1";
          const topRes = (hasTop ? (odd(n1) ? MINUS : "") + topFactors.join(DOT) : "1");
          const botRes = (hasBot ? (odd(n2) ? MINUS : "") + botFactors.join(DOT) : "1");
          const topStart = hasTop ? `(${MINUS}${a}${DOT}${baseHTML("b")})<sup>${fmtInt(n1)}</sup>` : "1";
          const botStart = hasBot ? `(${MINUS}${c}${DOT}${baseHTML("d")})<sup>${fmtInt(n2)}</sup>` : "1";
          if (hasBot) {
            steps.push({
              title: `Az előjel leválasztása és a szorzatok hatványozása: ${ID_PROD} (minden tényezőre, a −1-re is)`,
              rows: [equation([fraction(topStart, botStart), fraction(topPow, botPow), fraction(topRes, botRes)])],
              note: [hasTop ? `Számláló: ${signNote(n1)}` : "", `Nevező: ${signNote(n2)}`].filter(Boolean).join("<br>"),
            });
          } else {
            steps.push({
              title: `Az előjel leválasztása és a szorzat hatványozása: ${ID_PROD} (minden tényezőre, a −1-re is)`,
              rows: [equation([topStart, topPow, topRes])],
              note: signNote(n1),
            });
          }
          const topPlain = hasTop ? topFactors.join(DOT) : "1";
          const botPlain = hasBot ? botFactors.join(DOT) : "1";
          if (hasBot && (odd(n1) || odd(n2))) {
            steps.push({
              title: "Az előjelek összevonása",
              rows: [equation([fraction(topRes, botRes), sf(topPlain, botPlain)])],
              note: "Két azonos előjel hányadosa pozitív, két különbözőé negatív.",
            });
          }
          const items = [];
          if (hasTop) items.push({ base: a, exp: n1 }, { base: "b", exp: n1 });
          if (hasBot) {
            if (hasTop) {
              steps.push({
                title: flipTitle,
                rows: [equation([sf(topPlain, botPlain), `${sp}${topFactors.concat(botFactors.map((_, i) => power(i === 0 ? c : "d", -n2))).join(DOT)}`])],
              });
            } else {
              steps.push({
                title: flipTitle,
                rows: [equation([sf("1", botPlain), `${sp}${[power(c, -n2), power("d", -n2)].join(DOT)}`])],
              });
            }
            items.push({ base: c, exp: -n2 }, { base: "d", exp: -n2 });
          }
          mergeStep(steps, items, sp, mergeTitle);
          items.forEach((it) => bases.add(it.base));
        }
      } else {
        const spec = specOf(p);
        const k = spec.k;
        const ni = spec.ni;
        const hasZero =
          k === 0 || ni === 0 ||
          spec.top.some((pc) => !pc.plain && pc.exp === 0) ||
          (spec.den && spec.den.exp === 0);
        let top = spec.top.filter((pc) => pc.plain || pc.exp !== 0);
        if (ni === 0) top = [];
        const den = spec.den && spec.den.exp !== 0 ? spec.den : null;

        if (hasZero) {
          steps.push({
            title: zeroTitle,
            rows: [equation([renderBase(spec, { hl: true }), k === 0 ? "1" : renderBase(spec, { reduced: true })])],
            note: k === 0 ? "A 0 kitevőjű hatvány értéke 1, tehát az egész kifejezés értéke 1." : zeroNote,
          });
        }

        if (k !== 0 && top.length === 0 && !den) {
          // csak (−1)^k maradt
          steps.push({
            title: `Az előjel meghatározása. ${SIGN_RULE}`,
            rows: [equation([ub(m1(k), signLabel(k)), negative ? `${MINUS}1` : "1"])],
            note: signNote(k),
          });
        } else if (k !== 0) {
          const baseNum = ni !== null ? ni : 1; // a „plain" tényező kitevője
          const aPiece = top.find((pc) => pc.plain);
          const others = top.filter((pc) => !pc.plain);
          const aNeg = Boolean(aPiece && aPiece.neg);
          const innerOdd = aNeg && odd(ni);
          const denHTML = den ? power(den.base, den.exp) : null;
          const wrapBase = (num) =>
            den ? bigParen(signedFraction(MINUS, num, denHTML), k) : `(${MINUS}${num})<sup>${fmtInt(k)}</sup>`;

          // a „belső" hatvány (sub 5): (a · b^n3)^n1
          let pieces = top.map((pc) => ({
            base: pc.base,
            exp: pc.plain ? baseNum : pc.exp * (ni ?? 1),
            bare: pc.plain && ni === null,
          }));
          if (ni !== null && (others.length > 0 || aNeg)) {
            const reducedStart = renderBase(spec, { reduced: true });
            const mid = [
              aPiece ? `${aNeg ? ub(m1(ni), signLabel(ni)) + DOT : ""}${power(aPiece.base, ni)}` : "",
              ...others.map((pc) => `(${power(pc.base, pc.exp)})<sup>${fmtInt(ni)}</sup>`),
            ].filter(Boolean).join(DOT);
            const done = pieces.map((pc) => power(pc.base, pc.exp)).join(DOT);
            steps.push({
              title: aNeg
                ? `A belső zárójel felbontása, az a előjelének leválasztása: ${ID_PROD}, ${ID_POW}`
                : `A belső zárójel felbontása: ${ID_PROD} és ${ID_POW}`,
              rows: [equation([reducedStart, wrapBase(mid), wrapBase((innerOdd ? MINUS : "") + done)])],
              note: aNeg ? signNote(ni) : "",
            });
            if (innerOdd) {
              steps.push({
                title: `A két mínusz összevonása: ${MINUS}(${MINUS}1) = +1`,
                rows: [equation([wrapBase(`${MINUS}${done}`), den ? bigParen(fraction(done, denHTML), k) : `(${done})<sup>${fmtInt(k)}</sup>`])],
                note: "Két negatív előjel szorzata pozitív, ezért a hatványozandó alap pozitív.",
              });
            }
          }
          const baseNeg = !innerOdd;
          const disp = (pc) => (pc.bare ? String(pc.base) : power(pc.base, pc.exp));
          const topNow = pieces.length ? pieces.map(disp).join(DOT) : "1";
          const plainBase = den ? bigParen(fraction(topNow, denHTML), k) : `(${topNow})<sup>${fmtInt(k)}</sup>`;
          const powered = pieces.map((pc) =>
            pc.bare || pc.exp === 1
              ? `${pc.base}<sup>${fmtInt(k)}</sup>`
              : `${baseHTML(pc.base)}<sup>${wrapNeg(pc.exp)}&middot;${wrapNeg(k)}</sup>`
          );
          const computedPieces = pieces.map((pc) => ({ base: pc.base, exp: pc.exp * k }));
          const computedNum = computedPieces.length ? computedPieces.map((it) => power(it.base, it.exp)).join(DOT) : "1";
          const poweredNum = powered.length ? powered.join(DOT) : "1";
          const E3 = den ? den.exp * k : 0;
          const poweredDen = den ? `${den.base}<sup>${wrapNeg(den.exp)}&middot;${wrapNeg(k)}</sup>` : null;
          const compDen = den ? power(den.base, E3) : null;
          const layout = (num, dn) => (dn ? fraction(num, dn) : num);
          const startRow = pieces.length && ni === null && !den && !hasZero ? renderBase(spec) : baseNeg ? wrapBase(topNow) : plainBase;
          if (baseNeg) {
            const sgn = ub(m1(k), signLabel(k));
            const sgnResult = (num, dn) => (odd(k) ? (dn ? signedFraction(MINUS, num, dn) : `${MINUS}${num}`) : layout(num, dn));
            steps.push({
              title: [splitTitle, den ? ID_FRAC : "", pieces.some((pc) => !pc.bare) ? ID_POW : ""].filter(Boolean).join(", "),
              rows: [equation([startRow, `${sgn}${DOT}${layout(poweredNum, poweredDen)}`, sgnResult(computedNum, compDen)])],
              note: signNote(k),
            });
          } else {
            steps.push({
              title: `${den ? "Tört" : "Szorzat"} hatványozása: ${[den ? ID_FRAC : "", pieces.length > 1 ? ID_PROD : "", pieces.some((pc) => !pc.bare) ? ID_POW : ""].filter(Boolean).join(", ")}`,
              rows: [equation([startRow, layout(poweredNum, poweredDen), layout(computedNum, compDen)])],
            });
          }

          const items = computedPieces.map((it) => ({ ...it }));
          if (den) {
            const flipped = `${sp}${[...computedPieces.map((it) => power(it.base, it.exp)), power(den.base, -E3)].join(DOT)}`;
            steps.push({
              title: flipTitle,
              rows: [equation([sf(computedNum, compDen), flipped])],
            });
            items.push({ base: den.base, exp: -E3 });
          }
          mergeStep(steps, items, sp, mergeTitle);
          items.forEach((it) => bases.add(it.base));
        }
      }

      // Nulladik hatvány a számítás során keletkezett 0 kitevőkre (pl. összevonás után)
      const liveTotals = new Map([...totals].filter(([b]) => bases.has(b)));
      zeroStep(steps, liveTotals, sp);

      // Végeredmény: előjel, prímek növekvő sorrendben, majd a betűk
      const order = [...totals.keys()].filter((b) => totals.get(b) !== 0).sort(compareBases);
      const body = order.map((b) => power(b, totals.get(b))).join(DOT);
      const shown = (negative ? MINUS : "") + (body || "1");
      steps.push({
        title: "Végeredmény kanonikus alakban",
        rows: [`<span class="final">${shown}</span>`],
        note:
          "Előbb az előjel, utána a prímek növekvő sorrendben, majd a betűk; a 0 kitevőjű tényezők nem szerepelnek." +
          (body ? "" : negative ? " Itt minden kitevő 0, ezért csak az előjel marad: −1." : " Itt minden kitevő 0, ezért a szorzat értéke 1."),
      });
      return steps;
    }

    // ---------- Megjelenítés ----------
    function groupHTML(g) {
      const inner = g.factors.map((f) => (f.plain ? baseHTML(f.base) : power(f.base, f.exp))).join(DOT);
      return `(${inner})<sup>${fmtInt(g.outer)}</sup>`;
    }

    function renderFormula(problem) {
      if (problem.kind === "neg") {
        $("formulaDisplay").innerHTML = negFormulaHTML(problem);
        return;
      }
      const [num, den] = problem.groups;
      $("formulaDisplay").innerHTML = den ? fraction(groupHTML(num), groupHTML(den)) : groupHTML(num);
    }

    function buildSteps(level, solution) {
      const { groups: [num, den], flipped, primeTerms, totals } = solution;
      const steps = [];

      // 1. Zárójelek felbontása
      const written = (g) =>
        g.factors
          .map((f) =>
            f.plain
              ? `${baseHTML(f.base)}<sup>${fmtInt(g.outer)}</sup>`
              : `${baseHTML(f.base)}<sup>${wrapNeg(f.inner)}&middot;${wrapNeg(g.outer)}</sup>`
          )
          .join(DOT);
      const computed = (g) => g.factors.map((f) => power(f.base, f.exp)).join(DOT);
      const computedFraction = den ? fraction(computed(num), computed(den)) : computed(num);

      steps.push({
        title:
          level === 1
            ? `Hatvány hatványozása: ${ID_POW}`
            : `Szorzat hatványozása és hatvány hatványozása: ${ID_PROD} és ${ID_POW}`,
        rows: [equation([den ? fraction(written(num), written(den)) : written(num), computedFraction])],
      });

      // 2. A nevező kitevőinek átfordítása
      if (den) steps.push({
        title: `A nevező kitevőinek átfordítása: ${ID_NEGEXP}`,
        note: `Azonos alapnál ugyanez közvetlenül is megkapható: ${ID_DIV}.`,
        rows: [equation([computedFraction, flipped.map((t) => power(t.base, t.exp)).join(DOT)])],
      });

      // 3. Összetett alapok felbontása (csak ha van ilyen)
      const composites = flipped.filter((t) => !isLetter(t.base) && isComposite(t.base));
      if (composites.length > 0) {
        steps.push({
          title: "Összetett alapok felbontása prímtényezőkre",
          rows: composites.map(({ base, exp }) => {
            const f = factorize(base);
            const decomposed = f.map(([p, k]) => (k === 1 ? String(p) : `${p}<sup>${k}</sup>`)).join(DOT);
            return equation([
              power(base, exp),
              `(${decomposed})<sup>${fmtInt(exp)}</sup>`,
              f.map(([p, k]) => power(p, k * exp)).join(DOT),
            ]);
          }),
          note: `Itt is: ${ID_PROD} és ${ID_POW}.`,
        });
      }

      // 4. Közös alapok összevonása
      const order = [...totals.keys()].sort(compareBases);
      const merged = order
        .map((b) => {
          const exps = primeTerms.filter((t) => t.base === b).map((t) => t.exp);
          return exps.length === 1
            ? power(b, exps[0])
            : `${baseHTML(b)}<sup>${exps.map(wrapNeg).join(" + ")}</sup>`;
        })
        .join(DOT);
      const values = order
        .map((b) => `<span${totals.get(b) === 0 ? ' class="zero"' : ""}>${power(b, totals.get(b))}</span>`)
        .join(DOT);

      if (!LEVELS[level].single) {
        steps.push({
          title: `Közös alapok összevonása: ${ID_MUL}`,
          rows: [equation([merged, values])],
        });
      }

      // Nulladik hatvány (ha van 0 kitevőjű alap)
      zeroStep(steps, totals);

      // 5. Végeredmény kanonikus alakban
      const nonZero = order.filter((b) => totals.get(b) !== 0);
      const canonical = nonZero.map((b) => power(b, totals.get(b))).join(DOT);
      steps.push({
        title: "Végeredmény kanonikus alakban",
        rows: [`<span class="final">${canonical}</span>`],
        note: "Előbb a számalapok (prímek) növekvő sorrendben, utána a betűalapok; a 0 kitevőjű tényezők nem szerepelnek (a<sup>0</sup> = 1).",
      });

      return steps;
    }

    function renderSteps(steps) {
      $("solutionContent").innerHTML = steps
        .map(
          (s, i) => `<div class="step">
            <div class="step-title">${i + 1}. ${s.title}</div>
            ${s.rows.map((r) => `<div class="step-math">${r}</div>`).join("")}
            ${s.note ? `<div class="step-note">${s.note}</div>` : ""}
          </div>`
        )
        .join("");
    }

    function renderAll() {
      renderFormula(state.problem);
      renderSteps(
        state.level === "neg"
          ? buildNegSteps(state.problem, state.solution)
          : buildSteps(state.level, state.solution)
      );
    }

    // ---------- Saját válasz ----------
    function answerBasesFor(st) {
      return st.level === "neg" ? NEG_SUBLEVELS[st.sub].answerBases : LEVELS[st.level].answerBases;
    }

    // „text": a teljes választ begépeli; „boxes": előjel + kitevő-mezők
    function answerModeFor(st) {
      return "text"; // minden szinten a teljes választ gépeli be a tanuló
    }

    function buildAnswerFields() {
      const isNeg = state.level === "neg";
      if (answerModeFor(state) === "text") {
        $("answerRow").innerHTML = `<div class="ans-input ans-text ans-editor" contenteditable="true" role="textbox"
            aria-label="A teljes válasz" spellcheck="false" autocapitalize="off" data-text="1"
            data-placeholder="pl. ${EXAMPLE_ONE}"></div>
          <button type="button" class="pow-btn" aria-label="Kitevő beszúrása" title="Kitevő beszúrása (^)">x<sup>n</sup></button>
          <button type="button" class="mul-btn" aria-label="Szorzásjel beszúrása" title="Szorzásjel (*)">·</button>`;
        $("answerHint").textContent =
          `Írd be a végeredményt kanonikus alakban, előre az előjelet, ha negatív, pl. ${EXAMPLE_ONE} vagy ${EXAMPLE_THREE}. A 0 kitevőjű tényezőt nem kötelező kiírni.`;
        return;
      }
      const signField = isNeg
        ? `<span class="ans-field"><input class="ans-input ans-sign" type="text" autocomplete="off"
            maxlength="2" placeholder="+" data-sign="1" aria-label="Az eredmény előjele"></span>`
        : "";
      const fields = answerBasesFor(state)
        .map(
          (b) => `<label class="ans-field">${baseHTML(b)}<input class="ans-input" type="text" inputmode="text"
            autocomplete="off" maxlength="4" data-base="${b}" aria-label="A(z) ${b} kitevője"></label>`
        )
        .join(DOT);
      $("answerRow").innerHTML = signField + fields;
      $("answerHint").textContent = isNeg
        ? "Írd fel az eredményt kanonikus alakban: előjel, utána a prímek növekvő sorrendben, majd a betűk. Pozitív előjelnél hagyd üresen az előjel mezőt (vagy írj +-t); ha egy alap nem szerepel, hagyd üresen (vagy írj 0-t)."
        : "Írd fel az eredményt kanonikus alakban: a prímek növekvő sorrendben, utána a betűk. Ha egy alap nem szerepel, hagyd üresen (vagy írj 0-t).";
    }

    function answerInputs() {
      return Array.from(document.querySelectorAll(".ans-input"));
    }

    function clearAnswers() {
      for (const input of answerInputs()) {
        if (input.dataset.text) input.innerHTML = "";
        else input.value = "";
        input.classList.remove("ok", "bad");
      }
      setFeedback("", "");
      updatePreview();
    }

    function setFeedback(text, kind) {
      const el = $("feedback");
      el.textContent = text;
      el.className = "feedback" + (kind ? " " + kind : "");
    }

    // A mínusz bármelyik gyakori alakját elfogadja (-, −, –)
    function parseExponent(text) {
      const s = text.trim().replace(/[−–—]/g, "-");
      return /^[+-]?\d+$/.test(s) ? parseInt(s, 10) : null;
    }

    function inputBase(input) {
      const raw = input.dataset.base;
      return Number.isNaN(Number(raw)) ? raw : Number(raw);
    }

    // ---------- Begépelt (szöveges) válasz ----------
    const SUPERSCRIPT_DIGITS = "\u2070\u00B9\u00B2\u00B3\u2074\u2075\u2076\u2077\u2078\u2079";

    const EXAMPLE_ONE = MINUS + "2⁻³"; // −2⁻³
    const EXAMPLE_THREE = MINUS + "2\u00B3 \u00B7 3\u00B3 \u00B7 a \u00B7 b\u00B2"; // −2³ · 3³ · a · b²
    const EXAMPLE_TWO = "2³ · 5⁻¹"; // 2³ · 5⁻¹

    // ---------- Szerkesztő a begépelt válaszhoz: valódi felső index, üres kitevő-doboz ----------
    const ZWSP = "​"; // a kitevő-dobozban ez tartja a kurzort
    const CARET_PATTERN = /\^\s*\(?\s*([+\-−]?\s*\d*)\s*\)?|([⁻⁰¹²³⁴-⁹]+)/;
    let pasting = false;

    const editorOf = () => answerInputs().find((i) => i.dataset.text);

    // A szerkesztő tartalma szövegként; a kitevő ^(…) alakot kap, pl. „2^(−3) · 5^(2)"
    function typedText(editor) {
      let out = "";
      for (const node of editor.childNodes) {
        const text = node.textContent.replace(/​/g, "");
        out += node.nodeName === "SUP" ? `^(${text})` : text;
      }
      return out;
    }

    function makeExponentBox(content) {
      const sup = document.createElement("sup");
      sup.textContent = ZWSP + content;
      sup.className = content === "" ? "exp exp-empty" : "exp";
      return sup;
    }

    function placeCaret(node, offset) {
      const range = document.createRange();
      range.setStart(node, offset);
      range.collapse(true);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    // A kurzor a doboz mögé kerül, külön szövegcsomópontba (hogy ne a kitevőbe gépeljen tovább)
    function caretAfterBox(sup) {
      let next = sup.nextSibling;
      if (!next || next.nodeType !== Node.TEXT_NODE) {
        next = document.createTextNode(ZWSP);
        sup.after(next);
      }
      if (next.textContent === "") next.textContent = ZWSP; // üres szövegcsomópontba nem fér kurzor
      placeCaret(next, next.textContent.startsWith(ZWSP) ? 1 : 0);
    }

    function placeCaretAtEnd(editor) {
      const last = editor.lastChild;
      if (!last) return;
      if (last.nodeType === Node.TEXT_NODE) placeCaret(last, last.length);
      else caretAfterBox(last);
    }

    // A dobozba csak kitevő kerülhet (mínusz + számjegyek); ami más, az kikerül mögé, a kurzorral együtt
    function normalizeBoxes(editor) {
      const sel = window.getSelection();
      for (const sup of [...editor.querySelectorAll("sup")]) {
        const caretInside = sel.rangeCount > 0 && sup.contains(sel.anchorNode);
        const text = sup.textContent;

        if (text === "") {
          // a doboz teljesen kiürült (pl. törlés) → eltűnik
          const prev = sup.previousSibling;
          sup.remove();
          if (caretInside) {
            if (prev && prev.nodeType === Node.TEXT_NODE) placeCaret(prev, prev.length);
            else placeCaret(editor, 0);
          }
          continue;
        }

        const valid = /^​*[-−]?\d*/.exec(text)[0];
        const rest = text.slice(valid.length).replace(/[\^ˆ]/g, "");
        const content = valid.replace(/​/g, "").replace("-", MINUS);
        const wanted = ZWSP + content;

        if (text !== wanted) {
          sup.textContent = wanted;
          if (caretInside && rest === "") placeCaret(sup.firstChild, wanted.length);
        }
        sup.classList.toggle("exp-empty", content === "");

        if (rest !== "") {
          const after = document.createTextNode(rest);
          sup.after(after);
          if (caretInside) placeCaret(after, rest.length);
        }
      }
    }

    // ^ jelek (holt billentyű, beillesztés) és beillesztett felső indexek → kitevő-doboz
    function convertCarets(editor, paste) {
      const sel = window.getSelection();
      for (let guard = 0; guard < 50; guard++) {
        const node = [...editor.childNodes].find(
          (n) => n.nodeType === Node.TEXT_NODE && CARET_PATTERN.test(n.textContent)
        );
        if (!node) break;
        const text = node.textContent;
        const m = CARET_PATTERN.exec(text);
        const matchEnd = m.index + m[0].length;
        const caretAtEnd = sel.rangeCount > 0 && sel.anchorNode === node && sel.anchorOffset === matchEnd;
        const raw = m[1] ?? [...m[2]].map((ch) => (ch === "⁻" ? "-" : SUPERSCRIPT_DIGITS.indexOf(ch))).join("");
        const sup = makeExponentBox(raw.replace(/\s+/g, "").replace("-", MINUS));
        node.textContent = text.slice(0, m.index);
        node.after(sup, document.createTextNode(text.slice(matchEnd)));
        if (caretAtEnd && !paste) placeCaret(sup.firstChild, sup.firstChild.length);
      }
      if (paste) placeCaretAtEnd(editor);
    }

    // A * (és ×) jel szorzásjellé alakul: „2 · 5"
    function convertStars(editor) {
      const sel = window.getSelection();
      for (const node of [...editor.childNodes]) {
        if (node.nodeType !== Node.TEXT_NODE || !/[*\u00D7]/.test(node.textContent)) continue;
        const text = node.textContent;
        const hasCaret = sel.rangeCount > 0 && sel.anchorNode === node;
        const offset = hasCaret ? sel.anchorOffset : 0;
        const fix = (t) => t.replace(/\s*[*\u00D7]\s*/g, "\u00A0\u00B7\u00A0");
        const before = fix(text.slice(0, offset));
        node.textContent = fix(text);
        if (hasCaret) placeCaret(node, before.length);
      }
    }

    function normalizeEditor(editor, paste) {
      normalizeBoxes(editor);
      convertCarets(editor, paste);
      convertStars(editor);
      if (!editor.querySelector("sup") && editor.textContent.replace(/​/g, "") === "") {
        editor.innerHTML = ""; // így újra látszik a halvány minta-szöveg
      }
    }

    // Az xⁿ gomb: azonnal üres kitevő-doboz jelenik meg a kurzornál, a kurzor bekerül
    function insertExponentBox() {
      const editor = editorOf();
      if (!editor) return;
      editor.focus();
      const sel = window.getSelection();
      let range = sel.rangeCount > 0 && editor.contains(sel.anchorNode) ? sel.getRangeAt(0) : null;

      if (range) {
        const container = range.startContainer;
        const el = container.nodeType === Node.ELEMENT_NODE ? container : container.parentElement;
        const enclosing = el && el.closest("sup");
        if (enclosing) {
          caretAfterBox(enclosing); // már a dobozban áll: kilép belőle
          return;
        }
      } else {
        range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
      }

      range.deleteContents();
      const sup = makeExponentBox("");
      range.insertNode(sup);
      placeCaret(sup.firstChild, 1);
      editor.classList.remove("ok", "bad");
      setFeedback("", "");
      updatePreview();
    }

    // A · gomb: szorzásjelet ír a kurzorhoz (kitevőből kilépve)
    function insertMultiplication() {
      const editor = editorOf();
      if (!editor) return;
      editor.focus();
      const sel = window.getSelection();
      if (sel.rangeCount === 0 || !editor.contains(sel.anchorNode)) placeCaretAtEnd(editor);
      const node = sel.anchorNode;
      const el = node && (node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement);
      const sup = el && el.closest("sup");
      if (sup) caretAfterBox(sup);
      document.execCommand("insertText", false, " \u00B7 ");
    }

    // A „Megoldás" gomb: a kész választ beírja a szerkesztőbe, valódi felső indexszel
    function fillEditor(editor, totals, negative) {
      editor.textContent = "";
      const bases = [...totals.keys()].filter((b) => totals.get(b) !== 0).sort(compareBases);
      if (negative) editor.append(MINUS);
      if (bases.length === 0) {
        editor.append("1");
        return;
      }
      bases.forEach((b, i) => {
        editor.append((i > 0 ? " · " : "") + b);
        editor.append(makeExponentBox(fmtInt(totals.get(b))));
      });
    }

    // Pl. „−2^−3 · 5^2", „2^(−3)*5²" → { negative, totals, duplicate, ordered } vagy null, ha nem érthető
    function parseTypedAnswer(text, allowedBases) {
      let t = text
        .trim()
        .replace(/[\u2212\u2013\u2014]/g, "-")
        .replace(/-\s+/g, "-") // „− 2", „^(− 3)"
        .replace(/\s*\^\s*/g, "^") // elütött szóközök a kitevő körül
        .replace(/\(\s+/g, "(")
        .replace(/\s+\)/g, ")")
        // beillesztett felső indexek (² ³ ⁻ …) → ^(kitevő)
        .replace(/[\u207B\u2070\u00B9\u00B2\u00B3\u2074-\u2079]+/g, (m) =>
          "^(" + [...m].map((ch) => (ch === "\u207B" ? "-" : SUPERSCRIPT_DIGITS.indexOf(ch))).join("") + ")"
        )
        .replace(/[\u00B7\u00D7\u22C5]/g, "*")
        .replace(/\s+/g, "*") // a szóköz is szorzás
        .replace(/\*{2,}/g, "*")
        .replace(/\*$/, "")
        // kimaradt szorzásjel: 2^(3)5^(-1), 2a, ab
        .replace(/\)(?=[\da-z])/gi, ")*")
        .replace(/([a-z])(?=[\da-z])/gi, "$1*")
        .replace(/(\d)(?=[a-z])/gi, "$1*");

      let negative = false;
      if (t.startsWith("-")) {
        negative = true;
        t = t.slice(1);
      } else if (t.startsWith("+")) {
        t = t.slice(1);
      }
      if (t === "") return null;

      const totals = new Map();
      const seen = [];
      let duplicate = false;
      for (const factor of t.split("*")) {
        const m = /^(\d+|[a-z])(?:\^\(?([+-]?\d+)\)?)?$/i.exec(factor);
        if (!m) return null;
        const base = /^\d+$/.test(m[1]) ? Number(m[1]) : m[1].toLowerCase();
        const exp = m[2] === undefined ? 1 : parseInt(m[2], 10);
        if (base === 1) continue; // az 1-es tényező nem számít
        if (!allowedBases.includes(base)) return null;
        if (totals.has(base)) duplicate = true;
        seen.push(base);
        totals.set(base, (totals.get(base) ?? 0) + exp);
      }
      const ordered = seen.every((b, i) => i === 0 || compareBases(seen[i - 1], b) < 0);
      return { negative, totals, duplicate, ordered };
    }

    // Élő előnézet: a beírt válasz „tényleges" kanonikus alakja, a nem használt (0 kitevőjű) alapok nélkül
    function updatePreview() {
      const inputs = answerInputs();
      const el = $("previewMath");
      const textInput = inputs.find((i) => i.dataset.text);
      if (textInput) {
        const text = typedText(textInput);
        if (text.trim() === "") {
          el.innerHTML = '<span class="preview-empty">(még nincs kitöltve)</span>';
          return;
        }
        const typed = parseTypedAnswer(text, answerBasesFor(state));
        if (!typed) {
          el.innerHTML = `<span class="preview-empty">(ezt még nem értem, pl. ${EXAMPLE_ONE})</span>`;
          return;
        }
        const parts = [...typed.totals.keys()]
          .filter((b) => typed.totals.get(b) !== 0)
          .sort(compareBases)
          .map((b) => power(b, typed.totals.get(b)));
        el.innerHTML = (typed.negative ? MINUS : "") + (parts.join(DOT) || "1");
        return;
      }
      if (inputs.every((input) => input.value.trim() === "")) {
        el.innerHTML = '<span class="preview-empty">(még nincs kitöltve)</span>';
        return;
      }

      let negative = false;
      let invalid = false;
      const parts = [];
      for (const input of inputs) {
        const raw = input.value.trim();
        if (input.dataset.sign) {
          const sign = parseSign(raw);
          if (sign === null) invalid = true;
          else negative = sign === "-";
          continue;
        }
        const base = inputBase(input);
        const value = raw === "" ? 0 : parseExponent(raw);
        if (value === null) {
          parts.push(`${baseHTML(base)}<sup>?</sup>`);
        } else if (value !== 0) {
          parts.push(power(base, value));
        }
      }

      const body = parts.join(DOT) || "1";
      el.innerHTML = (negative ? MINUS : "") + body + (invalid ? ' <span class="preview-empty">(az előjel nem érthető)</span>' : "");
    }

    // Előjel mező: üres vagy + → pozitív, −/- → negatív
    function parseSign(text) {
      const t = text.trim().replace(/[\u2212\u2013\u2014]/g, "-");
      if (t === "" || t === "+") return "+";
      return t === "-" ? "-" : null;
    }

    function checkTypedAnswer(input) {
      input.classList.remove("ok", "bad");
      const text = typedText(input);
      if (text.trim() === "") {
        setFeedback("Írd be a választ! (Ha az eredmény 1, írj 1-et.)", "bad");
        return;
      }
      const typed = parseTypedAnswer(text, answerBasesFor(state));
      if (!typed) {
        input.classList.add("bad");
        setFeedback(`Ezt nem értem. Kanonikus alakban válaszolj, pl. ${EXAMPLE_ONE} vagy ${EXAMPLE_TWO}.`, "bad");
        return;
      }

      const { totals, negative } = state.solution;
      const sameValue = answerBasesFor(state).every((b) => (typed.totals.get(b) ?? 0) === (totals.get(b) ?? 0));
      const sameSign = typed.negative === Boolean(negative);

      if (sameValue && sameSign && typed.duplicate) {
        input.classList.add("bad");
        setFeedback("Az érték jó, de az azonos alapokat vond össze egyetlen hatvánnyá!", "bad");
      } else if (sameValue && sameSign && !typed.ordered) {
        input.classList.add("bad");
        setFeedback("Az érték jó, de kanonikus alakban a prímek növekvő sorrendben követik egymást.", "bad");
      } else if (sameValue && sameSign) {
        input.classList.add("ok");
        setFeedback("Helyes!", "ok");
      } else if (sameValue) {
        input.classList.add("bad");
        setFeedback("A kitevők jók, de az előjel nem.", "bad");
      } else if (sameSign) {
        input.classList.add("bad");
        setFeedback("Az előjel jó, de a hatvány nem. Nézd át a kitevőket!", "bad");
      } else {
        input.classList.add("bad");
        setFeedback("Nem jó, próbáld újra!", "bad");
      }
    }

    function checkAnswer() {
      const textInput = answerInputs().find((i) => i.dataset.text);
      if (textInput) {
        checkTypedAnswer(textInput);
        return;
      }
      const isNeg = state.level === "neg";
      const parsed = answerInputs().map((input) => ({
        input,
        raw: input.value.trim(),
        isSign: Boolean(input.dataset.sign),
      }));
      for (const { input } of parsed) input.classList.remove("ok", "bad");

      if (parsed.every(({ raw }) => raw === "")) {
        setFeedback(
          isNeg
            ? "Írj be legalább egy értéket! (Ha az eredmény 1, írj 0-t egy mezőbe.)"
            : "Írj be legalább egy kitevőt!",
          "bad"
        );
        return;
      }

      // Az üresen hagyott kitevő 0-nak, az üres előjel pozitívnak számít
      const valueOf = ({ raw, isSign }) =>
        isSign ? parseSign(raw) : raw === "" ? 0 : parseExponent(raw);

      const invalid = parsed.filter((item) => valueOf(item) === null);
      if (invalid.length > 0) {
        for (const { input } of invalid) input.classList.add("bad");
        setFeedback(
          isNeg
            ? `Kitevőnek egész számot írj (pl. ${MINUS}3), előjelnek + vagy ${MINUS} jelet.`
            : `Csak egész számot írj be, pl. ${MINUS}3 vagy 2.`,
          "bad"
        );
        return;
      }

      let correct = 0;
      for (const item of parsed) {
        const expected = item.isSign
          ? (state.solution.negative ? "-" : "+")
          : state.solution.totals.get(inputBase(item.input)) ?? 0;
        const ok = valueOf(item) === expected;
        item.input.classList.add(ok ? "ok" : "bad");
        if (ok) correct++;
      }

      if (correct === parsed.length) {
        setFeedback(isNeg ? "Helyes! Az előjel és minden kitevő jó." : "Helyes! Minden kitevő jó.", "ok");
      } else {
        setFeedback(
          `${correct} / ${parsed.length} ${isNeg ? "mező" : "kitevő"} jó. Nézd át a pirossal jelölteket!`,
          "bad"
        );
      }
    }

    // A helyes megoldást beírja a mezőkbe
    function fillAnswer() {
      for (const input of answerInputs()) {
        if (input.dataset.text) {
          fillEditor(input, state.solution.totals, state.solution.negative);
          input.classList.remove("bad");
          input.classList.add("ok");
          continue;
        }
        input.value = input.dataset.sign
          ? (state.solution.negative ? MINUS : "+")
          : fmtInt(state.solution.totals.get(inputBase(input)) ?? 0);
        input.classList.remove("bad");
        input.classList.add("ok");
      }
      setFeedback("A helyes megoldás beírva.", "ok");
      updatePreview();
    }

    // ---------- Vezérlés ----------
    function generate() {
      state = { ...state, ...createProblem(state.level, state.sub) };
      renderAll();
      clearAnswers(); // nincs automatikus fókusz: telefonon ez ellapozná az oldalt
    }

    // A szintgombok és a „Negatív alap" fejléc állapotának frissítése
    function refreshLevelButtons() {
      const isNeg = state.level === "neg";
      for (const btn of $("levels").querySelectorAll("button[data-level]")) {
        const checked = btn.dataset.sub
          ? isNeg && Number(btn.dataset.sub) === state.sub
          : btn.dataset.level === String(state.level);
        btn.setAttribute("aria-checked", String(checked));
      }
      $("negHead").classList.toggle("active", isNeg);
    }

    function setLevel(level) {
      state.level = level;
      refreshLevelButtons();
      buildAnswerFields();
      generate();
    }

    // „Negatív alap" üzemmód, adott alszinttel
    function setNeg(sub) {
      state.level = "neg";
      state.sub = sub;
      refreshLevelButtons();
      buildAnswerFields();
      generate();
    }

    function toggleSolution(event) {
      const hidden = $("solutionContent").classList.toggle("hidden");
      event.currentTarget.textContent = hidden ? "Megoldás mutatása" : "Megoldás elrejtése";
      event.currentTarget.setAttribute("aria-expanded", String(!hidden));
    }

    function init() {
      const levelButtons = Object.keys(LEVELS)
        .filter((l) => l !== "neg")
        .map((l) => `<button type="button" role="radio" aria-checked="false" data-level="${l}">${l}. szint</button>`)
        .join("");
      const subButtons = Object.keys(NEG_SUBLEVELS)
        .map(
          (n) =>
            `<button type="button" role="radio" aria-checked="false" data-level="neg" data-sub="${n}" aria-label="Negatív alap, ${n}. alszint">${n}</button>`
        )
        .join("");
      $("levels").innerHTML = `${levelButtons}<div id="negHead" class="neg-head">Negatív alap</div>${subButtons}`;
      $("levels").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-level]");
        if (!btn) return;
        if (btn.dataset.sub) setNeg(Number(btn.dataset.sub));
        else setLevel(Number(btn.dataset.level));
      });

      $("generateBtn").addEventListener("click", generate);
      $("checkBtn").addEventListener("click", checkAnswer);
      $("fillBtn").addEventListener("click", fillAnswer);
      $("toggleSolutionBtn").addEventListener("click", toggleSolution);
      $("answerRow").addEventListener("input", (e) => {
        // Szerkesztés után a korábbi ellenőrzés eredménye már nem érvényes
        e.target.classList.remove("ok", "bad");
        if (e.target.dataset?.text) {
          normalizeEditor(e.target, pasting);
          setFeedback("", "");
        }
        updatePreview();
      });
      // Beillesztésnél csak sima szöveg kerül be (a ^ és a felső index kitevő-dobozzá alakul)
      $("answerRow").addEventListener("paste", (e) => {
        if (!e.target.dataset?.text) return;
        e.preventDefault();
        const text = (e.clipboardData?.getData("text/plain") ?? "").replace(/\s+/g, " ");
        pasting = true;
        document.execCommand("insertText", false, text);
        pasting = false;
      });
      // A gomb ne vegye el a fókuszt a szerkesztőtől (telefonon sem)
      $("answerRow").addEventListener("mousedown", (e) => {
        if (e.target.closest(".pow-btn, .mul-btn")) e.preventDefault();
      });
      $("answerRow").addEventListener("click", (e) => {
        if (e.target.closest(".pow-btn")) insertExponentBox();
        else if (e.target.closest(".mul-btn")) insertMultiplication();
      });
      $("answerRow").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          checkAnswer();
        } else if (e.key === "ArrowRight" && e.target.dataset?.text) {
          // a kitevő végén a → kilép a dobozból, a további írás már normál méretű
          const sel = window.getSelection();
          const node = sel.anchorNode;
          const el = node && (node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement);
          const sup = el && el.closest("sup");
          const tail = document.createRange();
          if (sup) {
            tail.setStart(sel.anchorNode, sel.anchorOffset);
            tail.setEnd(sup, sup.childNodes.length);
          }
          if (sup && sel.isCollapsed && tail.toString() === "") {
            e.preventDefault();
            caretAfterBox(sup);
          }
        }
      });
      // Az xⁿ gomb kék, amíg a kurzor kitevő-dobozban áll
      document.addEventListener("selectionchange", () => {
        const btn = document.querySelector(".pow-btn");
        if (!btn) return;
        const node = window.getSelection()?.anchorNode;
        const el = node && (node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement);
        btn.classList.toggle("active", Boolean(el && el.closest(".ans-editor sup")));
      });

      setLevel(1);
    }

    init();
  </script>
</body>
</html>
